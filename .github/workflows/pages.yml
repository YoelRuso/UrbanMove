name: Publicar diagramas de arquitectura

on:
  push:
    branches: [main]
    paths:
      - "docs/01-arquitectura/diagramas/*.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar el sitio (solo los diagramas, sin el resto del vault)
        run: |
          mkdir -p _site
          cp docs/01-arquitectura/diagramas/*.html _site/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>UrbanMove: arquitectura</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #14201b; }
              li { margin: 12px 0; }
              p { color: #555; }
            </style>
          </head>
          <body>
            <h1>UrbanMove: arquitectura</h1>
            <p>Opciones para debatir, no decisiones del equipo.</p>
            <h2>Opciones de arquitectura (hexagonal)</h2>
            <ul>
              <li><a href="opcion-1-esencial.html">1. Esencial</a></li>
              <li><a href="opcion-2-blindada.html">2. Blindada</a></li>
              <li><a href="opcion-3-orquestada.html">3. Orquestada</a></li>
            </ul>
            <h2>Detalle</h2>
            <ul>
              <li><a href="mapa-de-servicios.html">Mapa de los 15 servicios</a></li>
              <li><a href="reservas-por-dentro.html">Reservas por dentro</a></li>
              <li><a href="contratos.html">Contratos</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
